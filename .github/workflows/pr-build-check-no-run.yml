name: PR build check (no run)

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - "*"

jobs:
  build_ubuntu_latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libuhd-dev libconfig++-dev libfftw3-dev libmbedtls-dev \
            libzmq3-dev libboost-all-dev libudev-dev \
            libcurl4-openssl-dev libpcsclite-dev libsctp-dev \
            librtlsdr-dev \
            libboost-program-options-dev libglib2.0-dev uhd-host

      - name: Configure and build (no run)
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)"

      - name: Verify expected build outputs
        run: |
          # Check that main srsRAN binaries exist, but do NOT run them
          for bin in build/srsue/src/srsue build/srsenb/src/srsenb build/srsepc/src/srsepc; do
            if [ ! -x "$bin" ] && [ ! -f "$bin" ]; then
              echo "Expected binary $bin was not produced"
              exit 1
            fi
          done

      - name: Upload build artifacts (libs and executables)
        uses: actions/upload-artifact@v4
        with:
          name: srsran2-build-ubuntu-latest
          path: |
            build/lib
            build/srsue/src/srsue
            build/srsenb/src/srsenb
            build/srsepc/src/srsepc

  build_ubuntu_24_04_arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

