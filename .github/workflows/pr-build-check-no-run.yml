            libzmq3-dev libboost-all-dev libudev-dev \
            libcurl4-openssl-dev libpcsclite-dev libsctp-dev \
            librtlsdr-dev \
            libboost-program-options-dev libglib2.0-dev uhd-host

      - name: Configure and build (no run)
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)"

      - name: Verify expected build outputs
        run: |
          # Check that main srsRAN binaries exist, but do NOT run them
          for bin in build/srsue/src/srsue build/srsenb/src/srsenb build/srsepc/src/srsepc; do
            if [ ! -x "$bin" ] && [ ! -f "$bin" ]; then
              echo "Expected binary $bin was not produced"
              exit 1
            fi
          done

      - name: Upload build artifacts (libs and executables)
        uses: actions/upload-artifact@v4
        with:
          name: srsran2-build-ubuntu-24.04-arm
          path: |
